version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksentry_backend
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/stocksentry.db:/app/stocksentry.db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocksentry_frontend
    restart: always
    ports:
      - "8080:80"

  caddy:
    image: caddy:2-alpine
    container_name: stocksentry_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
